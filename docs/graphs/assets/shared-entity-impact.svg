<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc">
<title id="title">Why an unchanged document is affected</title>
<desc id="desc">The company overview mentions Lunar Excursions. One-hop expansion follows that shared entity to facts owned by other documents, exposing invalid VISITS and REQUIRES facts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43;font-size:20px}.title{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.box{stroke:#567795;stroke-width:2}.read{fill:#eaf3ff}.write{fill:#fff3df}.store{fill:#e8f5ef}.invalid{fill:#ffebee;stroke:#b42318}</style>
<rect width="720" height="630" fill="#fff"/>
<text x="360" y="40" text-anchor="middle" class="title">Why an unchanged document is affected</text>
<rect x="60" y="70" width="600" height="90" rx="12" class="box read"/>
<text x="360.0" y="108.0" text-anchor="middle" class="label">company-overview</text>
<text x="360.0" y="136.0" text-anchor="middle" class="detail">Its four OFFERS facts remain valid</text>
<path d="M360 160 V204" class="edge"/>
<rect x="60" y="210" width="600" height="90" rx="12" class="box read"/>
<text x="360.0" y="248.0" text-anchor="middle" class="label">MENTIONS → Lunar Excursions</text>
<text x="360.0" y="276.0" text-anchor="middle" class="detail">Shared entity connects the documents</text>
<path d="M360 300 V344" class="edge"/>
<rect x="60" y="350" width="600" height="90" rx="12" class="box write"/>
<text x="360.0" y="388.0" text-anchor="middle" class="label">One-hop graph context</text>
<text x="360.0" y="416.0" text-anchor="middle" class="detail">VISITS from itinerary; REQUIRES from training policy</text>
<path d="M360 440 V484" class="edge"/>
<rect x="60" y="490" width="600" height="90" rx="12" class="box invalid"/>
<text x="360.0" y="528.0" text-anchor="middle" class="label">Both connected facts are invalid under v3</text>
<text x="360.0" y="556.0" text-anchor="middle" class="detail">Review questions even though the overview is unchanged</text>
</svg>
