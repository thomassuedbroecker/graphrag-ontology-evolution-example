<svg xmlns="http://www.w3.org/2000/svg" width="720" height="455" viewBox="0 0 720 455" role="img" aria-labelledby="title desc">
<title id="title">V2 ontology — approved</title><desc id="desc">V2 retains Company OFFERS Service and Service VISITS Destination, and adds Service REQUIRES Training. Dashed orange box identifies the new type.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:20px} .heading{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}</style>
<rect width="720" height="455" fill="#ffffff"/>
<text class="heading" x="360" y="40" text-anchor="middle">V2 ontology — approved</text>
<path d="M360 130 L360 210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="153.0" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="175.0">OFFERS</text>
<path d="M280 270 L170 375" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="233.0" y="305.5" width="220" height="30" fill="#ffffff"/>
<text class="label" x="239.0" y="327.5">VISITS</text>
<path d="M440 270 L550 375" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="503.0" y="305.5" width="220" height="30" fill="#ffffff"/>
<text class="label" x="509.0" y="327.5">REQUIRES (new)</text>
<rect x="210" y="70" width="300" height="60" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="360.0" y="107.0" text-anchor="middle">Company</text>
<rect x="210" y="210" width="300" height="60" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="360.0" y="247.0" text-anchor="middle">Service</text>
<rect x="35" y="375" width="270" height="60" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="170.0" y="412.0" text-anchor="middle">Destination</text>
<rect x="415" y="375" width="270" height="60" rx="10" fill="#fff7ed" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 4"/>
<text x="550.0" y="412.0" text-anchor="middle">Training (new)</text>
</svg>
