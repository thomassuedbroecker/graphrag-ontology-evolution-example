<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
<title id="title">Graph version dependencies</title><desc id="desc">A new graph starts on v1, which supports the baseline, new-service and passage-only training datasets. The approved v2 extends v1 with Training and REQUIRES; migrating moves the stored documents to v2, after which the training fact is imported.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43;font-size:20px} .heading{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}</style>
<rect width="720" height="680" fill="#ffffff"/>
<text class="heading" x="360" y="40" text-anchor="middle">Graph version dependencies</text>
<path d="M360 140 L360 235" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="170.5" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="192.5">models</text>
<path d="M155 105 L45 105 L45 465 L155 465" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="48" y="350" width="220" height="30" fill="#ffffff"/>
<text class="label" x="54" y="372">migrate (Lab 6)</text>
<path d="M360 505 L360 590" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="530.5" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="552.5">imports (Lab 7)</text>
<rect x="155" y="70" width="410" height="70" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2.5" />
<text x="360.0" y="112.0" text-anchor="middle">V1 — baseline (Labs 1–5)</text>
<rect x="90" y="235" width="540" height="90" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2.5" />
<text x="360.0" y="273.0" text-anchor="middle">Baseline / new service / passage</text>
<text x="360.0" y="301.0" text-anchor="middle">Same ontology; different document facts</text>
<rect x="155" y="425" width="410" height="80" rx="12" fill="#fff3df" stroke="#80551b" stroke-width="2.5"/>
<text x="360.0" y="458.0" text-anchor="middle">V2 — approved, extends v1</text>
<text x="360.0" y="486.0" text-anchor="middle">Adds Training and REQUIRES</text>
<rect x="90" y="590" width="540" height="65" rx="12" fill="#fff3df" stroke="#80551b" stroke-width="2.5"/>
<text x="360.0" y="615.5" text-anchor="middle">Migrated documents + training fact</text>
<text x="360.0" y="643.5" text-anchor="middle">Active after Labs 6–7</text>
</svg>
