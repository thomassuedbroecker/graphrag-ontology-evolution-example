<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">RAG evidence dependencies</title><desc id="desc">The answering agent uses MCP passage search backed by Ollama embeddings and Neo4j active documents. Graph context, which the model may skip, expands document mentions through entities to adjacent facts. Results carry document IDs and sources for citation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:20px} .heading{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.note{font-size:20px;fill:#9a3412}</style>
<rect width="720" height="760" fill="#ffffff"/>
<text class="heading" x="360" y="40" text-anchor="middle">RAG evidence dependencies</text>
<path d="M360 140 L360 220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="163.0" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="185.0">search first</text>
<path d="M360 300 L360 380" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" fill="none"/>
<text class="label" x="374.0" y="333.0">use document ID</text>
<text class="note" x="374.0" y="359.0">model decides</text>
<path d="M360 460 L360 540" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="483.0" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="505.0">expand</text>
<path d="M360 605 L360 640" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="368.0" y="605.5" width="220" height="30" fill="#ffffff"/>
<text class="label" x="374.0" y="627.5">cite</text>
<rect x="140" y="70" width="440" height="70" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="360.0" y="98.0" text-anchor="middle">Question → answering agent</text>
<text x="360.0" y="126.0" text-anchor="middle">ChatOllama selects read-only tools</text>
<rect x="140" y="220" width="440" height="80" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="360.0" y="253.0" text-anchor="middle">MCP: search_documents</text>
<text x="360.0" y="281.0" text-anchor="middle">Ollama vector → Neo4j passage search</text>
<rect x="140" y="380" width="440" height="80" rx="10" fill="#fff7ed" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 5" />
<text x="360.0" y="413.0" text-anchor="middle">MCP: graph_context</text>
<text x="360.0" y="441.0" text-anchor="middle">Document → MENTIONS → Entity</text>
<rect x="140" y="540" width="440" height="65" rx="10" fill="#fff7ed" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 5" />
<text x="360.0" y="565.5" text-anchor="middle">Adjacent RELATION facts</text>
<text x="360.0" y="593.5" text-anchor="middle">One hop; includes other documents</text>
<rect x="140" y="640" width="440" height="45" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2" />
<text x="360.0" y="669.5" text-anchor="middle">Answer with document IDs and sources</text>
<text x="360" y="730" text-anchor="middle">Dashed: optional; skipped in the recorded runs.</text>
</svg>
