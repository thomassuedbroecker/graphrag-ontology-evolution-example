<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
<title id="title">Why keep a separate discovery document</title>
<desc id="desc">A separate document prevents preparation from overwriting the assertion, distinguishes its origin, and permits a targeted replacement through the importer. Deletion is not implemented.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43;font-size:20px}.title{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.box{stroke:#567795;stroke-width:2}.read{fill:#eaf3ff}.write{fill:#fff3df}.store{fill:#e8f5ef}.invalid{fill:#ffebee;stroke:#b42318}</style>
<rect width="720" height="690" fill="#fff"/>
<text x="360" y="40" text-anchor="middle" class="title">Why keep a separate discovery document</text>
<rect x="60" y="70" width="600" height="90" rx="12" class="box store"/>
<text x="360.0" y="108.0" text-anchor="middle" class="label">Photography Tours VISITS Moon</text>
<text x="360.0" y="136.0" text-anchor="middle" class="detail">Stored as a separate discovery document</text>
<path d="M60 115 H30 V565" stroke="#52677b" stroke-width="2.5" fill="none"/>
<path d="M30 280 H54" class="edge"/>
<rect x="60" y="235" width="600" height="90" rx="12" class="box read"/>
<text x="360.0" y="273.0" text-anchor="middle" class="label">Preserve the assertion</text>
<text x="360.0" y="301.0" text-anchor="middle" class="detail">prepare can replace company-overview independently</text>
<path d="M30 425 H54" class="edge"/>
<rect x="60" y="380" width="600" height="90" rx="12" class="box read"/>
<text x="360.0" y="418.0" text-anchor="middle" class="label">Keep its origin visible</text>
<text x="360.0" y="446.0" text-anchor="middle" class="detail">Discovery stays distinct from mapped source facts</text>
<path d="M30 570 H54" class="edge"/>
<rect x="60" y="525" width="600" height="90" rx="12" class="box read"/>
<text x="360.0" y="563.0" text-anchor="middle" class="label">Retract through a reviewed replacement</text>
<text x="360.0" y="591.0" text-anchor="middle" class="detail">Same ID, no facts or evidence, corrected passage text</text>
<text x="360" y="660" text-anchor="middle" class="detail">Deleting a local JSON file does not delete an imported fact.</text>
</svg>
