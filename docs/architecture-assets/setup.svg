<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-label="Setup GraphRAG">
  <title>Setup GraphRAG</title>
  <desc>Setup in five steps: preserve the source with a stable ID and excerpt hash, prepare candidate documents with a curated mapping, validate structure and ontology while the operator reviews evidence, build the graph and vectors, and verify four expected assertions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52677b" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43}.title{font-size:26px;font-weight:700}.label{font-size:24px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="720" height="818" fill="#fff" />
  <text x="360" y="39" text-anchor="middle" class="title">Setup GraphRAG</text>
  <rect x="40" y="66" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="103" text-anchor="middle" class="label">Preserve source</text>
  <text x="360.0" y="135" text-anchor="middle" class="detail">Stable source ID and excerpt hash</text>
  <path class="edge" d="M360 161 V202" />
  <rect x="40" y="206" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="243" text-anchor="middle" class="label">Prepare candidates</text>
  <text x="360.0" y="275" text-anchor="middle" class="detail">Curated mapping now; LLM step proposed</text>
  <path class="edge" d="M360 301 V342" />
  <rect x="40" y="346" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="383" text-anchor="middle" class="label">Validate and review</text>
  <text x="360.0" y="415" text-anchor="middle" class="detail">CLI: structure / ontology; operator: evidence</text>
  <path class="edge" d="M360 441 V482" />
  <rect x="40" y="486" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="523" text-anchor="middle" class="label">Build graph and vectors</text>
  <text x="360.0" y="555" text-anchor="middle" class="detail">Controlled import and index checks</text>
  <path class="edge" d="M360 581 V622" />
  <rect x="40" y="626" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="663" text-anchor="middle" class="label">Verify baseline</text>
  <text x="360.0" y="695" text-anchor="middle" class="detail">Four expected assertions; cited retrieval</text>
  <text x="360" y="794" text-anchor="middle" class="detail">Current: curated mapping + CLI. Evidence review: manual.</text>
</svg>
