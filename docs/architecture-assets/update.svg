      <path d="M0 0L10 5L0 10Z" fill="#52677b" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43}.title{font-size:26px;font-weight:700}.label{font-size:24px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="720" height="818" fill="#fff" />
  <text x="360" y="39" text-anchor="middle" class="title">Update data within ontology v1</text>
