  <text x="360.0" y="103" text-anchor="middle" class="label">Changed source</text>
  <text x="360.0" y="135" text-anchor="middle" class="detail">Add Lunar Photography Tours</text>
  <path class="edge" d="M360 161 V202" />
  <rect x="40" y="206" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="243" text-anchor="middle" class="label">Prepare and resolve</text>
  <text x="360.0" y="275" text-anchor="middle" class="detail">A new Service instance; same model</text>
  <path class="edge" d="M360 301 V342" />
