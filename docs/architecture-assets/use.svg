<svg xmlns="http://www.w3.org/2000/svg" width="720" height="678" viewBox="0 0 720 678" role="img" aria-label="Use GraphRAG">
  <title>Use GraphRAG</title>
  <desc>A user question goes to the read-only answering agent, which chooses MCP tools to retrieve vector passages and one-hop graph facts, then composes a cited answer or reports missing evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52677b" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43}.title{font-size:26px;font-weight:700}.label{font-size:24px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="720" height="678" fill="#fff" />
  <text x="360" y="39" text-anchor="middle" class="title">Use GraphRAG</text>
  <rect x="40" y="66" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="103" text-anchor="middle" class="label">Ask a question</text>
  <text x="360.0" y="135" text-anchor="middle" class="detail">User asks about source-backed knowledge</text>
  <path class="edge" d="M360 161 V202" />
  <rect x="40" y="206" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="243" text-anchor="middle" class="label">Answering agent</text>
  <text x="360.0" y="275" text-anchor="middle" class="detail">Choose read-only MCP tools</text>
  <path class="edge" d="M360 301 V342" />
  <rect x="40" y="346" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="383" text-anchor="middle" class="label">Retrieve evidence</text>
  <text x="360.0" y="415" text-anchor="middle" class="detail">Vector passages and one-hop graph facts</text>
  <path class="edge" d="M360 441 V482" />
  <rect x="40" y="486" width="640" height="94" rx="12" fill="#eaf3ff" stroke="#567795" stroke-width="2" />
  <text x="360.0" y="523" text-anchor="middle" class="label">Compose cited answer</text>
  <text x="360.0" y="555" text-anchor="middle" class="detail">Report missing evidence; no graph writes</text>
  <text x="360" y="654" text-anchor="middle" class="detail">Implemented tools. Tool order and citations: model-dependent.</text>
</svg>
