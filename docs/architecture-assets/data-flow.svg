<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1055" viewBox="0 0 720 1055" role="img" aria-labelledby="title desc">
<title id="title">Data after each step</title>
<desc id="desc">Maintenance prepares, validates, plans and imports documents. Answering searches passages, may expand graph facts, and returns an answer trace. The model can skip expansion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c43;font-size:20px}.title{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:600}.detail{font-size:20px}.edge{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.box{stroke:#567795;stroke-width:2}.read{fill:#eaf3ff}.write{fill:#fff3df}.store{fill:#e8f5ef}.invalid{fill:#ffebee;stroke:#b42318}</style>
<rect width="720" height="1055" fill="#fff"/>
<text x="360" y="40" text-anchor="middle" class="title">Data after each step</text>
<text x="129" y="84" text-anchor="middle" class="label">Step and command</text>
<text x="477" y="84" text-anchor="middle" class="label">Data after the step</text>
<rect x="24" y="104" width="210" height="80" rx="12" class="box write"/>
<text x="129.0" y="137.0" text-anchor="middle" class="label">1 · Source</text>
<text x="129.0" y="165.0" text-anchor="middle" class="detail">input Markdown</text>
<rect x="258" y="104" width="438" height="80" rx="12" class="box write"/>
<text x="477.0" y="137.0" text-anchor="middle" class="label">Primary Services section</text>
<text x="477.0" y="165.0" text-anchor="middle" class="detail">+ Lunar Photography Tours</text>
<path d="M129 185 V210" class="edge"/>
<rect x="24" y="216" width="210" height="80" rx="12" class="box write"/>
<text x="129.0" y="249.0" text-anchor="middle" class="label">2 · Prepare</text>
<text x="129.0" y="277.0" text-anchor="middle" class="detail">graphrag prepare</text>
<rect x="258" y="216" width="438" height="80" rx="12" class="box write"/>
<text x="477.0" y="249.0" text-anchor="middle" class="label">JSON: company, lunar</text>
<text x="477.0" y="277.0" text-anchor="middle" class="detail">+1 entity, +1 OFFERS fact, new hash</text>
<path d="M129 297 V322" class="edge"/>
<rect x="24" y="328" width="210" height="80" rx="12" class="box write"/>
<text x="129.0" y="361.0" text-anchor="middle" class="label">3 · Validate</text>
<text x="129.0" y="389.0" text-anchor="middle" class="detail">graphrag validate</text>
<rect x="258" y="328" width="438" height="80" rx="12" class="box write"/>
<text x="477.0" y="361.0" text-anchor="middle" class="label">Same JSON, accepted</text>
<text x="477.0" y="389.0" text-anchor="middle" class="detail">Types, endpoints, evidence quotes</text>
<path d="M129 409 V434" class="edge"/>
<rect x="24" y="440" width="210" height="80" rx="12" class="box write"/>
<text x="129.0" y="473.0" text-anchor="middle" class="label">4 · Plan</text>
<text x="129.0" y="501.0" text-anchor="middle" class="detail">ingest.sh</text>
<rect x="258" y="440" width="438" height="80" rx="12" class="box write"/>
<text x="477.0" y="473.0" text-anchor="middle" class="label">Action and fact diff</text>
<text x="477.0" y="501.0" text-anchor="middle" class="detail">Company update +1; lunar unchanged</text>
<path d="M129 521 V546" class="edge"/>
<rect x="24" y="552" width="210" height="80" rx="12" class="box store"/>
<text x="129.0" y="585.0" text-anchor="middle" class="label">5 · Apply</text>
<text x="129.0" y="613.0" text-anchor="middle" class="detail">ingest.sh --apply</text>
<rect x="258" y="552" width="438" height="80" rx="12" class="box store"/>
<text x="477.0" y="585.0" text-anchor="middle" class="label">Neo4j graph and vectors</text>
<text x="477.0" y="613.0" text-anchor="middle" class="detail">New embedding, edges, Revision</text>
<path d="M129 633 V658" class="edge"/>
<rect x="24" y="664" width="210" height="80" rx="12" class="box read"/>
<text x="129.0" y="697.0" text-anchor="middle" class="label">6 · Search</text>
<text x="129.0" y="725.0" text-anchor="middle" class="detail">search_documents</text>
<rect x="258" y="664" width="438" height="80" rx="12" class="box read"/>
<text x="477.0" y="697.0" text-anchor="middle" class="label">Passages with scores</text>
<text x="477.0" y="725.0" text-anchor="middle" class="detail">Company 0.86, lunar 0.85</text>
<path d="M129 745 V770" class="edge dash"/>
<rect x="24" y="776" width="210" height="80" rx="12" class="box read dash"/>
<text x="129.0" y="809.0" text-anchor="middle" class="label">7 · Expand</text>
<text x="129.0" y="837.0" text-anchor="middle" class="detail">graph_context</text>
<rect x="258" y="776" width="438" height="80" rx="12" class="box read dash"/>
<text x="477.0" y="809.0" text-anchor="middle" class="label">One-hop facts</text>
<text x="477.0" y="837.0" text-anchor="middle" class="detail">Lunar Excursions VISITS Moon</text>
<path d="M129 857 V882" class="edge dash"/>
<rect x="24" y="888" width="210" height="80" rx="12" class="box read"/>
<text x="129.0" y="921.0" text-anchor="middle" class="label">8 · Answer</text>
<text x="129.0" y="949.0" text-anchor="middle" class="detail">ask --trace</text>
<rect x="258" y="888" width="438" height="80" rx="12" class="box read"/>
<text x="477.0" y="921.0" text-anchor="middle" class="label">Trace JSON</text>
<text x="477.0" y="949.0" text-anchor="middle" class="detail">Prompt, tool calls, cited answer</text>
<text x="360" y="1006" text-anchor="middle" class="detail">Orange: maintenance. Green: database. Blue: answering.</text>
<text x="360" y="1034" text-anchor="middle" class="detail">Dashed: the model decides; skipped in recorded runs.</text>
</svg>
